<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adu Tarik Dino</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%A6%96%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--g:#14b8a6;--gd:#0e3b22;--p:#a855f7;--pd:#3b1673}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0b1220}
body{font-family:'Nunito','Trebuchet MS',Arial,sans-serif;font-weight:900;color:#fff;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}
.scr.on{display:flex}
#home{background:linear-gradient(#74d4ff,#3a8dff)}
#mode{background:linear-gradient(#5fe8b5,#00a08a)}
#topic{background:linear-gradient(#d0a9ff,#6657fb)}
.pair{display:flex;gap:0;filter:drop-shadow(0 12px 18px rgba(0,0,0,.25))}
.pair img{width:clamp(120px,19vw,220px);height:auto;margin:0 -6px}
.pill{background:rgba(30,80,140,.45);padding:.45em 1.5em;border-radius:99px;letter-spacing:.12em;font-size:clamp(.8rem,1.8vw,1.15rem);margin:14px 0 6px}
h1{font-size:clamp(2.4rem,8vw,5.5rem);margin:.1em 0 .25em;-webkit-text-stroke:5px #1c3f94;paint-order:stroke fill;text-shadow:0 6px 0 rgba(20,40,110,.45);line-height:1}
h2{font-size:clamp(1.6rem,4.5vw,3rem);margin:0 0 22px;text-shadow:0 3px 8px rgba(0,0,0,.2)}
.row{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
.btn{font:inherit;border:0;cursor:pointer;color:#fff;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px)}
.btn:focus-visible{outline:4px solid #ffe066;outline-offset:3px}
.play{background:#ffc400;color:#7a3a00;border:4px solid #fff;border-radius:99px;padding:.45em 1.6em;font-size:clamp(1.4rem,4vw,2.6rem);box-shadow:0 8px 0 #c25a00}
.play:active{box-shadow:0 3px 0 #c25a00}
.cup{width:clamp(56px,7vw,92px);height:clamp(56px,7vw,92px);border-radius:50%;background:#b44bff;border:4px solid #fff;box-shadow:0 8px 0 #5a1ca0;display:grid;place-items:center}
.cup svg{width:50%;height:50%}
.card{min-width:clamp(140px,26vw,300px);padding:clamp(24px,5vw,56px) 16px;border-radius:34px;font-size:clamp(1.6rem,5vw,3.4rem);line-height:1.1}
.card small{display:block;font-size:.42em;opacity:.75;margin-top:6px}
.duel{background:#2b7dff;border:8px solid #5a9bff;box-shadow:0 14px 0 #1f3d96}
.squad{background:#ff6a00;border:8px solid #ff8a3d;box-shadow:0 14px 0 #a43c10}
.duel:active,.squad:active,.tp:active{box-shadow:0 4px 0 rgba(0,0,0,.3)}
.tp{background:#fff;color:#2d2a8c;border:6px solid #c6d0ff;box-shadow:0 12px 0 #4a1fa0;min-width:clamp(120px,26vw,320px);padding:clamp(24px,4.5vw,50px) 10px;border-radius:30px;font-size:clamp(1.1rem,3vw,2rem)}
/* game */
#game{justify-content:flex-start;padding:0;background:#0b1220;align-items:stretch}
.qrow{display:flex;height:24%;position:relative}
.q{flex:1;display:flex;align-items:center;justify-content:center;font-size:clamp(2.2rem,8vh,5.5rem);gap:.1em;padding:0 8px;overflow:hidden}
.q.g{background:linear-gradient(90deg,#052c2a,#0a4743)}
.q.p{background:linear-gradient(90deg,#2c0e50,#4a1a8a)}
.q .sw{display:inline-block;width:1em;height:1em}
.timer{position:absolute;left:50%;top:0;transform:translateX(-50%);background:#0b1220;border:4px solid #f5b400;border-top:0;border-radius:0 0 28px 28px;padding:6px 30px 8px;z-index:3}
.timer small{display:block;color:#f5b400;font-size:clamp(.6rem,1.6vh,.95rem);letter-spacing:.1em}
.timer b{font-family:ui-monospace,Consolas,monospace;font-size:clamp(1.6rem,5.5vh,3.2rem);line-height:1}
.ib{position:absolute;top:12px;width:clamp(40px,6vh,56px);height:clamp(40px,6vh,56px);border-radius:50%;display:grid;place-items:center;z-index:4;background:#1a1d2e;color:#fff}
.ib svg{width:55%;height:55%}
.ib.home{left:12px;background:#ef1c1c;border:3px solid #fff}
.ib.mt{right:72px}.ib.fs{right:12px}
.arena{position:relative;height:36%;background:linear-gradient(#d9ecf8,#bfdcf1);overflow:hidden;border-top:6px solid #1a2236;border-bottom:6px solid #0b1220}
.line{position:absolute;top:0;bottom:0;width:0;border-left:4px dashed}
.line.l{left:15%;border-color:rgba(20,184,166,.6)}
.line.r{right:15%;border-color:rgba(170,120,255,.6)}
.grass{position:absolute;left:0;right:0;bottom:0;height:11%;background:radial-gradient(ellipse at 50% 100%,#8bd34a 0,rgba(139,211,74,.0) 70%),repeating-linear-gradient(90deg,#8bd34a 0 10px,#78c23c 10px 22px);opacity:.75;-webkit-mask-image:linear-gradient(#0000,#000);mask-image:linear-gradient(#0000,#000)}
.grp{position:absolute;left:50%;bottom:5%;height:88%;aspect-ratio:3.2/1;transform:translateX(-50%);transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.grp>img{position:absolute;bottom:0;height:100%;width:auto;transform-origin:50% 100%;filter:drop-shadow(0 8px 6px rgba(0,0,0,.22));transition:transform .2s}
.dg{left:0}.dp{right:0}
.dg.t{transform:rotate(-5deg) translateX(-6px)}.dp.t{transform:rotate(5deg) translateX(6px)}
.rope{position:absolute;left:13%;right:13%;bottom:28%;height:8%;background:repeating-linear-gradient(135deg,#7b3412 0 9px,#4e1e08 9px 18px);border:2px solid #3a1505;border-radius:3px;box-shadow:0 6px 8px rgba(0,0,0,.25)}
.knot{position:absolute;bottom:24%;width:7%;height:24%;background:#6a3a14;border-radius:8px;border:2px solid #3a1505}
.k1{left:10%}.k2{right:10%}
.flag{position:absolute;left:50%;bottom:22%;height:28%;width:3%;background:#f0a070;border-radius:3px}
.flag::after{content:"";position:absolute;left:100%;top:6%;border-left:42px solid #f0386b;border-top:20px solid transparent;border-bottom:20px solid transparent}
.bot{display:flex;gap:16px;flex:1;padding:12px 10px 14px;min-height:0}
.team{flex:1;display:flex;gap:12px;border-radius:22px;padding:10px;min-width:0}
.team.g{background:#0b4f4a}.team.p{background:#4c1d95}
.set{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;min-width:0}
.ans{border:0;border-radius:18px;font:inherit;cursor:pointer;display:grid;place-items:center;font-size:clamp(1.8rem,7vh,4rem);color:#fff;min-height:0}
.g .ans{background:var(--g);box-shadow:0 8px 0 #0f766e}
.p .ans{background:var(--p);box-shadow:0 8px 0 #6b21a8}
.ans:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.ans .sw{display:block;width:.95em;height:.95em;border-radius:14%;box-shadow:inset 0 -5px 8px rgba(0,0,0,.25),0 4px 6px rgba(0,0,0,.3)}
.ans .sw.c{border-radius:50%}
.team.lock .ans{opacity:.45;pointer-events:none}
.ans.bad{animation:sh .35s;background:#555!important}
@keyframes sh{25%{translate:-8px 0}75%{translate:8px 0}}
.ov{position:absolute;inset:0;background:rgba(5,10,30,.72);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:10;gap:20px;text-align:center;padding:16px}
.ov.on{display:flex}
.ov h2{font-size:clamp(2rem,7vw,4.5rem);margin:0}
.ov p{margin:0;font-size:clamp(1rem,2.6vw,1.6rem)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="trophy" viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3M12 14v4M8 21h8M9 18h6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>

<section class="scr on" id="home">
  <div class="pair"><img data-d="g" alt="Dino tosca"><img data-d="p" alt="Dino ungu"></div>
  <div class="pill">GAME EDUKASI PAUD</div>
  <h1>ADU TARIK DINO</h1>
  <div class="row">
    <button class="btn play" id="go">MULAI BERMAIN</button>
    <button class="btn cup" id="trophy" aria-label="Skor"><svg><use href="#trophy"/></svg></button>
  </div>
</section>

<section class="scr" id="mode">
  <h2>PILIH MODE BERMAIN</h2>
  <div class="row">
    <button class="btn card duel" data-m="duel">DUEL<small>(1 Lawan 1)</small></button>
    <button class="btn card squad" data-m="squad">SQUAD<small>(2 Lawan 2)</small></button>
  </div>
</section>

<section class="scr" id="topic">
  <h2>PILIH TOPIK MATERI</h2>
  <div class="row">
    <button class="btn tp" data-t="hitung">Hitung Benda</button>
    <button class="btn tp" data-t="warna">Warna Benda</button>
    <button class="btn tp" data-t="hewan">Makanan Hewan</button>
  </div>
</section>

<section class="scr" id="game">
  <button class="ib home btn" id="gHome" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></button>
  <button class="ib mt btn" id="mute" aria-label="Suara"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM17 9l5 6M22 9l-5 6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="ib fs btn" id="full" aria-label="Layar penuh"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></button>
  <div class="qrow"><div class="q g" id="qg"></div><div class="q p" id="qp"></div>
    <div class="timer"><small>SISA WAKTU</small><b id="tm">03:00</b></div></div>
  <div class="arena">
    <div class="line l"></div><div class="line r"></div><div class="grass"></div>
    <div class="grp" id="grp">
      <div class="knot k1"></div><div class="knot k2"></div><div class="rope"></div><div class="flag"></div>
      <img class="dg" id="dg" data-d="g" alt="Dino tosca">
      <img class="dp" id="dp" data-d="p" alt="Dino ungu">
    </div>
  </div>
  <div class="bot"><div class="team g" id="tg"></div><div class="team p" id="tp"></div></div>
  <div class="ov" id="ov"><h2 id="ovT"></h2><p id="ovS"></p><div class="row"><button class="btn play" id="ovA">MAIN LAGI</button><button class="btn play" id="ovM" style="background:#fff;box-shadow:0 8px 0 #9aa">MENU</button></div></div>
</section>

var musicBus,sfxBus,noiseBuf,mTimer=null,mStep=0,mNext=0,mOn=false;
function getAC(){
  if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();
    sfxBus=ac.createGain();sfxBus.gain.value=1;sfxBus.connect(ac.destination);

var BPM_STEP=0.23; // durasi satu not 1/8 (detik)

function hz(m){return 440*Math.pow(2,(m-69)/12)}
function tone(m,t,dur,type,vol){
  var o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=hz(m);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);

function playStep(i,t){
  var bar=Math.floor(i/8)%8,st=i%8,m=MEL[bar][st],r=ROOT[bar];

  var q=Q[t];$('#q'+t).innerHTML=q.q;
  if(topic==='hitung')$('#q'+t).style.fontSize=q.q.length>12?'clamp(1.4rem,5vh,3.2rem)':'';else $('#q'+t).style.fontSize='';
  var sets=mode==='duel'?1:2,h='';
  for(var i=0;i<sets;i++)h+='<div class="set">'+shuf(q.o).map(function(k){return '<button class="ans" data-t="'+t+'" data-k="'+k+'">'+q.h(k)+'</button>'}).join('')+'</div>';
  $('#t'+t).innerHTML=h;
}
function layout(){var W=$('.arena').clientWidth;$('#grp').style.transform='translateX(calc(-50% + '+(pos*W*0.075)+'px))'}
function fmt(s){return ('0'+Math.floor(s/60)).slice(-2)+':'+('0'+s%60).slice(-2)}
function show(id){document.querySelectorAll('.scr').forEach(function(s){s.classList.remove('on')});$('#'+id).classList.add('on')}
function ov(t,s){$('#ovT').textContent=t;$('#ovS').textContent=s;$('#ov').classList.add('on')}
function start(){
  clearInterval(timer);pos=0;time=180;run=true;lock={g:false,p:false};
  $('#ov').classList.remove('on');$('#tm').textContent=fmt(time);
  show('game');Q={g:make(),p:make()};renderTeam('g');renderTeam('p');
  $('#tg').classList.remove('lock');$('#tp').classList.remove('lock');layout();
  timer=setInterval(function(){time--;$('#tm').textContent=fmt(Math.max(time,0));if(time<=0)end(pos<0?'g':pos>0?'p':null)},1000);
}
function end(w){
  if(!run)return;run=false;clearInterval(timer);
  if(w)wins[w]++;
  beep(784,.2);setTimeout(function(){beep(1046,.3)},180);
  setTimeout(function(){ov(w?(w==='g'?'Dino Tosca menang!':'Dino Ungu menang!'):'Seri!','Skor: Tosca '+wins.g+' | Ungu '+wins.p)},700);
}
$('#go').onclick=function(){startMusic();show('mode')};
$('#trophy').onclick=function(){ov('Skor','Tosca '+wins.g+' | Ungu '+wins.p);show('game');$('#ovA').textContent='TUTUP'; $('#ovA').dataset.close='1'};
document.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){mode=b.dataset.m;show('topic')}});
document.querySelectorAll('[data-t]').forEach(function(b){if(b.classList.contains('tp'))b.onclick=function(){topic=b.dataset.t;wins={g:0,p:0};$('#ovA').textContent='MAIN LAGI';delete $('#ovA').dataset.close;start()}});
$('#ovA').onclick=function(){if(this.dataset.close){$('#ov').classList.remove('on');show('home');this.textContent='MAIN LAGI';delete this.dataset.close}else start()};
$('#ovM').onclick=function(){clearInterval(timer);run=false;$('#ov').classList.remove('on');$('#ovA').textContent='MAIN LAGI';show('home')};
$('#gHome').onclick=$('#ovM').onclick;
$('#mute').onclick=function(){muted=!muted;this.style.opacity=muted?.5:1;if(musicBus)musicBus.gain.value=muted?0:.5;if(!muted)startMusic()};
(function(){var d=document,e=d.documentElement,b=$('#full');
var can=d.fullscreenEnabled||d.webkitFullscreenEnabled;
if(!can){b.style.display='none';$('#mute').style.right='12px';return}
b.onclick=function(){try{
 if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}
 else{var r=(e.requestFullscreen||e.webkitRequestFullscreen).call(e);if(r&&r.catch)r.catch(function(){})}
}catch(x){}}})();
$('.bot').addEventListener('click',function(e){
  var b=e.target.closest('.ans');if(!b||!run)return;
  var t=b.dataset.t;if(lock[t])return;
  if(b.dataset.k===Q[t].a){
    pos+=t==='g'?-1/STEP:1/STEP;layout();
    var d=$(t==='g'?'#dg':'#dp');d.classList.add('t');setTimeout(function(){d.classList.remove('t')},220);
    beep(500+Math.abs(pos)*300,.15,'triangle');
    if(Math.abs(pos)>=0.999){end(t);return}
    Q[t]=make();renderTeam(t);
  }else{
    b.classList.add('bad');beep(170,.25,'sawtooth');lock[t]=true;$('#t'+t).classList.add('lock');
    setTimeout(function(){lock[t]=false;$('#t'+t).classList.remove('lock');b.classList.remove('bad')},900);
  }
});
window.addEventListener('resize',layout);
})();
</script>
</body>
</html>
